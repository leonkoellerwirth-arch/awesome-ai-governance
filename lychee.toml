# lychee configuration for the weekly link check.
#
# Several authoritative sources sit behind Cloudflare or equivalent bot protection and
# return 403/503 to any non-browser client. They are reachable in a browser, so excluding
# them here prevents false failures. Re-check them by hand when touching those entries.

max_retries = 3
retry_wait_time = 4
# Several government sites answer in under three seconds from a normal client but hang
# for GitHub-hosted runners. A generous timeout and lower concurrency keep them from
# failing the build without pretending they were never checked.
timeout = 60
max_concurrency = 4
user_agent = "Mozilla/5.0 (compatible; awesome-ai-governance link-check; +https://github.com/leonkoellerwirth-arch/awesome-ai-governance)"

# Treat these as informational rather than failures.
accept = ["200", "202", "203", "204", "206", "429"]

exclude = [
  "^https://www\\.coe\\.int",
  "^https://unece\\.org",
  "^https://www\\.iso\\.org",
  "^https://www\\.industry\\.gov\\.au",
  "^https://www\\.edps\\.europa\\.eu",
  "^https://www\\.cac\\.gov\\.cn",
  "^https://www\\.meti\\.go\\.jp",
  "^https://iapp\\.org",
  "^https://leginfo\\.legislature\\.ca\\.gov",
  "^https://www\\.nyc\\.gov",
  # Answers 200 in under three seconds from an ordinary client but hangs past a 60s
  # timeout on GitHub-hosted runners, which points at IP-range blocking rather than a
  # slow server. Verified by hand 2026-08-27; re-check by hand when touching the entry.
  "^https://www25\\.senado\\.leg\\.br",
]
